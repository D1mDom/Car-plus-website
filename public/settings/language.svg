<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="480" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="khClip">
      <rect x="88" y="100" width="280" height="280" rx="24"/>
    </clipPath>
    <clipPath id="enClip">
      <rect x="432" y="100" width="280" height="280" rx="24"/>
    </clipPath>
  </defs>
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Cambodia card -->
  <rect x="88" y="100" width="280" height="280" rx="24" fill="#fff"/>
  <image href="/flags/flag-kh.png" x="88" y="100" width="280" height="280" clip-path="url(#khClip)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="88" y="320" width="280" height="60" rx="0" fill="#000" fill-opacity="0.45"/>
  <rect x="88" y="340" width="280" height="40" rx="0" fill="#000" fill-opacity="0"/>
  <text x="228" y="356" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">ខ្មែរ</text>
  <text x="228" y="378" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-family="system-ui,sans-serif" font-size="13">Khmer</text>

  <!-- English card -->
  <rect x="432" y="100" width="280" height="280" rx="24" fill="#fff"/>
  <image href="/flags/flag-en.png" x="432" y="100" width="280" height="280" clip-path="url(#enClip)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="432" y="320" width="280" height="60" fill="#000" fill-opacity="0.45"/>
  <text x="572" y="356" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="22" font-weight="700">English</text>
  <text x="572" y="378" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-family="system-ui,sans-serif" font-size="13">EN</text>

  <!-- Center badge -->
  <circle cx="400" cy="240" r="28" fill="#E11D48"/>
  <text x="400" y="247" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">⇄</text>
</svg>
